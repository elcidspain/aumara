name: Auto-Prepare-Merge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
  prepare-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lock + terrain gate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('AUMARA_TWIN_LOCK.json', 'utf8'));
          if (!lock.status) {
            console.error('AUMARA_TWIN_LOCK.json missing status');
            process.exit(1);
          }
          const terrain = JSON.parse(fs.readFileSync('twin/terrain_real.json', 'utf8'));
          console.log('lock.status', lock.status);
          console.log('canonical', lock.canonical && lock.canonical.repository);
          console.log('terrain.keys', Object.keys(terrain).length);
          if (String(lock.status).includes('GREEN')) {
            console.error('GREEN lock is invalid in elcidspain/aumara. Canonical twin is elcidspain/elcidspain.github.io');
            process.exit(1);
          }
          if (lock.status !== 'SUPERSEDED_DO_NOT_EXECUTE') {
            console.error('Unexpected lock status:', lock.status);
            process.exit(1);
          }
          if (!lock.canonical || lock.canonical.repository !== 'elcidspain/elcidspain.github.io') {
            console.error('canonical.repository must stay elcidspain/elcidspain.github.io');
            process.exit(1);
          }
          NODE

      - name: Install
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        env:
          CI: true
        run: npm run lint

      - name: Guest copy gate
        run: npm run assert-copy

  director:
    needs: prepare-merge
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run director
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREPARE_CONCLUSION: ${{ needs.prepare-merge.result }}
        run: node agent/director.mjs
