name: preview-v2-check

on:
  pull_request:
    paths:
      - "app/preview/**"
      - "components/site/PreviewLanding.tsx"
      - "lib/guest.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
