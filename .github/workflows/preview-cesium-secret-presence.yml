name: Preview Cesium credential presence

on:
  push:
    branches:
      - preview/spatial-descent-integration-20260905
    paths:
      - .github/workflows/preview-cesium-secret-presence.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      C1: ${{ secrets.CESIUM_ION_TOKEN }}
      C2: ${{ secrets.VITE_CESIUM_ION_ACCESS_TOKEN }}
      C3: ${{ secrets.CESIUM_TOKEN }}
      G1: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      G2: ${{ secrets.GOOGLE_MAPS_TILE_API_KEY }}
    steps:
      - name: Presence only
        shell: bash
        run: |
          for k in C1 C2 C3 G1 G2; do
            if [ -n "${!k}" ]; then echo "$k=present"; else echo "$k=absent"; fi
          done
