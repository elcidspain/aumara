name: Nominalia password reset request

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nominalia-reset-request.yml'

permissions:
  contents: read

jobs:
  request-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit exact Nominalia reset contract
        shell: bash
        env:
          CLIENT_ID: ID29270161-NOMI
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import os, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept-Language': 'es-ES,es;q=0.9,en;q=0.8',
          })
          start = s.get('https://controlpanel.nominalia.com/password/', timeout=30)
          start.raise_for_status()
          soup = BeautifulSoup(start.text, 'html.parser')
          form = soup.find('form')
          if not form:
              raise RuntimeError('Reset form not found')
          token = form.find('input', {'name':'_token'})
          if not token or not token.get('value'):
              raise RuntimeError('CSRF token missing')
          action = urljoin(start.url, form.get('action') or start.url)
          payload = {
              '_token': token['value'],
              'fieldType': 'userName',
              'fieldValue': os.environ['CLIENT_ID'],
          }
          r = s.post(action, data=payload, headers={'Referer': start.url}, timeout=30, allow_redirects=True)
          r.raise_for_status()
          text = ' '.join(BeautifulSoup(r.text, 'html.parser').get_text(' ', strip=True).split())
          low = text.lower()
          print('RESET_POST_STATUS=' + str(r.status_code))
          print('RESET_POST_FINAL_PATH=' + requests.utils.urlparse(r.url).path)
          print('RESET_POST_REDIRECTS=' + str(len(r.history)))
          signals = [x for x in ['enviado','enviad','email','correo','recuper','error','incorrect','no existe','no encontrado','not found','success','éxito'] if x in low]
          print('RESET_POST_SIGNALS=' + repr(signals))
          print('RESET_POST_BODY=' + text[:2200])
          if 'recibirás un email con el enlace' in low and len(r.history) == 0:
              # The generic form may intentionally remain on-screen; absence of a visible error is not failure.
              print('RESET_POST_GENERIC_FORM_RETURNED')
          print('RESET_POST_DONE')
          PY
