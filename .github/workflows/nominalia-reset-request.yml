name: Nominalia password reset request

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nominalia-reset-request.yml'

permissions:
  contents: read

jobs:
  request-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Submit Nominalia reset request by client ID
        shell: bash
        env:
          CLIENT_ID: ID29270161-NOMI
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          import os, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select, WebDriverWait

          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=opts)
          try:
              driver.get('https://controlpanel.nominalia.com/password/')
              wait = WebDriverWait(driver, 30)
              wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')

              selects = driver.find_elements(By.TAG_NAME, 'select')
              if not selects:
                  raise RuntimeError('No recovery selector found')
              sel = Select(selects[0])
              options = [(o.text or '').strip() for o in sel.options]
              print('RECOVERY_OPTIONS=' + repr(options))
              chosen = next((t for t in options if 'nombre de usuario' in t.lower()), None)
              if not chosen:
                  raise RuntimeError('Username recovery option not found')
              sel.select_by_visible_text(chosen)
              driver.execute_script("arguments[0].dispatchEvent(new Event('change', {bubbles:true}));", selects[0])
              time.sleep(1)

              inputs = [el for el in driver.find_elements(By.TAG_NAME, 'input') if el.is_displayed() and el.is_enabled() and (el.get_attribute('type') or '').lower() in ('text','email','')]
              if not inputs:
                  raise RuntimeError('No recovery input found')
              target = inputs[-1]
              print('RECOVERY_INPUT=' + str(target.get_attribute('name')))
              target.clear()
              target.send_keys(os.environ['CLIENT_ID'])

              buttons = driver.find_elements(By.XPATH, "//button|//input[@type='submit']")
              submit = next((b for b in buttons if 'continuar' in (((b.text or '') + ' ' + (b.get_attribute('value') or '')).lower())), None)
              if submit is None:
                  raise RuntimeError('Continuar button not found')
              before = driver.current_url
              submit.click()
              time.sleep(6)
              after = driver.current_url
              body = ' '.join(driver.find_element(By.TAG_NAME, 'body').text.split())
              print('RESET_REQUEST_CLICKED')
              print('URL_CHANGED=' + str(before != after))
              print('POST_URL=' + after)
              print('POST_BODY=' + body[:1800])
          finally:
              driver.quit()
          PY
