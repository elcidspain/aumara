name: Fix Google 3D handoff clipping v2
on:
  push:
    branches: [preview/spatial-descent-integration-20260905]
    paths: [.github/workflows/preview-spatial-google3d-handoff-fix-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/spatial-descent-integration-20260905
      - name: Disable Google clipping before local handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/spatial/index.html')
          s=p.read_text()
          old='''      tileset.clippingPolygons = new C.ClippingPolygonCollection({
        polygons: [new C.ClippingPolygon({ positions: clipPos })],
        enabled: true,
      });
      parcelClippingActive = true;'''
          new='''      tileset.clippingPolygons = new C.ClippingPolygonCollection({
        polygons: [new C.ClippingPolygon({ positions: clipPos })],
        enabled: false,
      });
      parcelClippingActive = false;'''
          if s.count(old) != 1:
              raise SystemExit('expected exact clipping block count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify
        run: |
          grep -A4 'tileset.clippingPolygons' public/spatial/index.html | grep -q 'enabled: false'
      - name: Commit
        run: |
          git config user.name aumara-preview-bot
          git config user.email elcidspain@gmail.com
          git add public/spatial/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'preview: disable Google clipping before handoff [skip ci]'
          git push origin HEAD:preview/spatial-descent-integration-20260905
