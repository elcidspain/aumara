name: Recon east bounded rigid grid

on:
  push:
    branches:
      - copilot/aumara-p0-recover-east-reconstruction-volume
    paths:
      - '.github/workflows/recon-east-rigid-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy opencv-python-headless
      - name: Generate best current east baseline
        run: >-
          python scripts/recover-p0-east.py
          --repo .
          --frame-count 56
          --pair-window 6
          --orb-features 6000
          --voxel 0.05
      - name: Evaluate bounded rigid transforms without writing artifacts
        run: |
          python - <<'PY'
          import base64, json, math, struct
          from pathlib import Path
          import numpy as np
          from scipy.spatial import cKDTree

          proof = Path('public/v3-3-proof')
          WEST_MIN = np.array([20.0, -12.0, -8.0])
          WEST_MAX = np.array([70.0, 20.0, 16.0])
          EAST_MIN = np.array([70.0, -12.0, -8.0])
          EAST_MAX = np.array([95.0, 20.0, 16.0])

          def decode(path, minv, maxv):
              raw = base64.b64decode(Path(path).read_text().strip())
              rows = []
              span = maxv - minv
              for i in range(0, len(raw) - 8, 9):
                  qx, qy, qz, r, g, b = struct.unpack('<HHHBBB', raw[i:i+9])
                  xyz = minv + span * np.array([qx, qy, qz]) / 65535.0
                  rows.append([*xyz, r, g, b])
              return np.asarray(rows, dtype=np.float64)

          def nn_metrics(source_xyz, target_xyz):
              if len(source_xyz) == 0 or len(target_xyz) == 0:
                  return None
              d, _ = cKDTree(target_xyz).query(source_xyz, k=1, workers=-1)
              return float(d.mean()), float(np.percentile(d, 95))

          west = np.vstack([decode(proof / f'p0-points-{i}.b64', WEST_MIN, WEST_MAX) for i in range(19)])
          east = np.vstack([decode(proof / f'p0-east-{i}.b64', EAST_MIN, EAST_MAX) for i in range(5)])
          west_ref = west[(west[:,0] >= 69.0) & (west[:,0] <= 70.0), :3]
          west_prev = west[(west[:,0] >= 68.0) & (west[:,0] <= 69.0), :3]
          base_mean, base_p95 = nn_metrics(west_prev, west_ref)

          houses = {h['id']: h for h in json.loads((proof / 'houses_af.json').read_text())}
          def support(points_xyz, hid, radius=3.8):
              h = houses[hid]
              center = np.array([h['east'], h['north']])
              return int((np.linalg.norm(points_xyz[:,:2] - center, axis=1) <= radius).sum())

          base_xyz = east[:, :3]
          base_E = support(base_xyz, 'E')
          base_F = support(base_xyz, 'F')
          origin_xy = np.array([70.0, 0.0])

          dx_values = np.round(np.arange(-0.35, 0.001, 0.025), 3)
          yaw_values = np.round(np.arange(0.0, 0.801, 0.1), 3)
          dy_values = np.round(np.arange(-0.3, 0.101, 0.1), 3)
          dz_values = np.round(np.arange(-0.2, 0.101, 0.1), 3)

          candidates = []
          for yaw in yaw_values:
              rad = math.radians(float(yaw))
              c, s = math.cos(rad), math.sin(rad)
              rot = np.array([[c, -s], [s, c]])
              rotated = base_xyz.copy()
              rotated[:, :2] = (base_xyz[:, :2] - origin_xy) @ rot.T + origin_xy
              for dx in dx_values:
                  for dy in dy_values:
                      moved_xy = rotated[:, :2] + np.array([dx, dy])
                      xmask = (moved_xy[:,0] >= 70.0) & (moved_xy[:,0] <= 71.0)
                      if int(xmask.sum()) < 50:
                          continue
                      for dz in dz_values:
                          moved = np.empty_like(base_xyz)
                          moved[:, :2] = moved_xy
                          moved[:, 2] = rotated[:, 2] + dz
                          metric = nn_metrics(west_ref, moved[xmask])
                          if metric is None:
                              continue
                          mean, p95 = metric
                          E = support(moved, 'E')
                          F = support(moved, 'F')
                          support_ok = E >= int(base_E * 0.9) and F >= int(base_F * 0.9)
                          mean_ratio = mean / base_mean
                          p95_ratio = p95 / base_p95
                          envelope_ok = bool(
                              moved[:,0].min() >= 69.5 and moved[:,0].max() <= 95.0 and
                              moved[:,1].min() >= -12.5 and moved[:,1].max() <= 20.5 and
                              moved[:,2].min() >= -8.5 and moved[:,2].max() <= 16.5
                          )
                          passed = mean_ratio <= 1.0 and p95_ratio <= 1.0 and support_ok and envelope_ok
                          candidates.append({
                              'dx_m': float(dx), 'dy_m': float(dy), 'dz_m': float(dz),
                              'yaw_deg': float(yaw),
                              'mean_ratio': mean_ratio, 'p95_ratio': p95_ratio,
                              'E_points': E, 'F_points': F,
                              'seam_band_points': int(xmask.sum()),
                              'support_ok': support_ok, 'envelope_ok': envelope_ok,
                              'pass': passed,
                              'score': max(mean_ratio, p95_ratio),
                              'min_xyz': moved.min(axis=0).round(6).tolist(),
                              'max_xyz': moved.max(axis=0).round(6).tolist(),
                          })

          candidates.sort(key=lambda r: (not r['pass'], r['score'], abs(r['dx_m']) + abs(r['dy_m']) + abs(r['dz_m']) + abs(r['yaw_deg']) / 10.0))
          print('AUMARA_RIGID_GRID_BASE', json.dumps({
              'west_baseline_mean': base_mean,
              'west_baseline_p95': base_p95,
              'east_points': int(len(base_xyz)),
              'E_points': base_E,
              'F_points': base_F,
              'candidates': len(candidates),
          }, sort_keys=True))
          for row in candidates[:20]:
              print('AUMARA_RIGID_GRID_CANDIDATE', json.dumps(row, sort_keys=True))
          passing = [r for r in candidates if r['pass']]
          print('AUMARA_RIGID_GRID_PASS_COUNT', len(passing))
          if passing:
              print('AUMARA_RIGID_GRID_BEST_PASS', json.dumps(passing[0], sort_keys=True))
          else:
              print('AUMARA_RIGID_GRID_RESULT HOLD_NO_BOUNDED_RIGID_PASS')
          PY
