name: AUMARA live runtime smoke

on:
  pull_request:
    paths:
      - 'components/site/GuestHome.tsx'
      - 'lib/openingPad.ts'
      - 'public/spatial/**'
      - 'app/spatial/**'
      - 'scripts/copy-spatial-three.mjs'
      - 'scripts/live-runtime-smoke.mjs'
      - 'scripts/flight-restart-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/live-runtime-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'components/site/GuestHome.tsx'
      - 'lib/openingPad.ts'
      - 'public/spatial/**'
      - 'app/spatial/**'
      - 'scripts/copy-spatial-three.mjs'
      - 'scripts/live-runtime-smoke.mjs'
      - 'scripts/flight-restart-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/live-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  live-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify local Three asset
        run: |
          test -s public/spatial/vendor/three.module.min.js
          test -s public/spatial/vendor/three.vendor.json
          grep -Fq 'three.module.min.js' public/spatial/local-twin.mjs
      - name: Flight close/reopen smoke
        run: node scripts/flight-restart-smoke.mjs
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/aumara-next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/aumara-next.log
          exit 1
      - name: Browser sound + flight smoke
        run: node scripts/live-runtime-smoke.mjs

      - name: Wait for public AUMARA runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 15 \
              https://www.aumara.me/spatial/flight-runtime.js \
              | grep -Fq 'AUMARA_START_LOCAL_FLIGHT'; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          curl --fail --silent --show-error --max-time 20 \
            https://www.aumara.me/spatial/vendor/three.module.min.js \
            -o /tmp/aumara-three.module.min.js
          test -s /tmp/aumara-three.module.min.js

      - name: Public production sound + flight smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AUMARA_SMOKE_BASE: https://www.aumara.me
        run: node scripts/live-runtime-smoke.mjs
