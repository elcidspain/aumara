<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AUMARA — CLEAN_LOCAL_HANDOFF</title>
<meta name="robots" content="noindex, nofollow"/>
<style>

    font:700 12px/1 system-ui,sans-serif;letter-spacing:.08em;cursor:pointer}

  #stage.local .cesium-widget-credits,#stage.local .cesium-credit-lightbox-overlay{display:none!important}
  #stage:not(.dbg) .cesium-widget-errorPanel{display:none!important}
</style>
<script src="./ion.js"></script>
</head>
<body>

  <div id="overlay"></div>
  <div id="status">AUMARA · starting…</div>
  <div id="hud">Earth…</div>
  <button id="close" type="button">Cerrar</button>
  <div id="sheet"></div>
</div>
<script>

    window.__AUMARA.globeShown = !!(viewer.scene.globe && viewer.scene.globe.show);
    const wp = elapsed < intro ? 0 : Math.min(27, Math.round(((elapsed - intro) / dur) * 27));
    if (wp > maxWp) { maxWp = wp; window.__AUMARA.waypointReached = wp; if (wp === 27) emit("WP27"); }
    if (elapsed >= intro && wp === 0) emit("WP0");
    if ((wp === 27 || atEnd) && !window.__AUMARA.flightComplete) {
      window.__AUMARA.flightComplete = true;
      window.__AUMARA.waypointReached = 27;
      viewer.clock.shouldAnimate = false;
      if (tickHandler) {
        try { viewer.clock.onTick.removeEventListener(tickHandler); } catch (e) {}
        tickHandler = null;
      }
      emit("WP27");
      setStatus(tilesOn ? "Handoff complete · local twin" : "Local twin complete");
    }
    if (DEBUG) hud.textContent = window.__AUMARA.verification_status + "  " + (tilesOn ? "GOOGLE  " : "LOCAL  ") + st + "  WP " + wp + "/27";
  }
  viewer.scene.postRender.addEventListener(() => {
    if (!firstFrameRendered) { firstFrameRendered = true; window.__AUMARA.firstFrameRendered = true; }
    hideGlobe(viewer, C);
    if (tilesOn && tileset && tileset.show) enableSkyForProvenTiles(viewer);
    const placed = [];
    arNodes.forEach(({ h, el }) => {
      const cam = viewer.camera.positionCartographic;
      const en = cam ? lonLatToEn(cam.longitude * 180 / Math.PI, cam.latitude * 180 / Math.PI, lon, lat) : { east: 999, north: 999 };
      const allow = handoffComplete && cam && (cam.height - originH) < 20 && Math.hypot(en.east, en.north) < 180;
      if (!allow) { el.style.display = "none"; return; }
      const p = C.Cartesian3.fromDegrees(h.wgs84.longitude, h.wgs84.latitude, originH + 5.4);
      const win = C.SceneTransforms.worldToWindowCoordinates(viewer.scene, p);
      if (!win) { el.style.display = "none"; return; }
      placed.push({ el, win, dist: C.Cartesian3.distance(viewer.camera.position, p) });
    });
    placed.sort((a, b) => a.dist - b.dist);
    placed.forEach((a, i) => {
      const clash = placed.slice(0, i).some((b) => Math.hypot(a.win.x - b.win.x, a.win.y - b.win.y) < 36);
      a.el.style.display = clash ? "none" : "block";
      if (!clash) { a.el.style.left = a.win.x + "px"; a.el.style.top = a.win.y + "px"; }
    });
  });
  tickHandler = function onFlightTick() { sampleOnce(); };
  viewer.clock.onTick.addEventListener(tickHandler);
}
</script>
